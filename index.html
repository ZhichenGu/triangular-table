<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="旋转三角餐桌，悬停餐盘，在中央窗口探索三维作品。"><title>潮汐之席</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Cpath d='M16 5 28 26H4Z' fill='none' stroke='%23ddd'/%3E%3C/svg%3E"></head><body>
<main><div id="scene" role="region" aria-label="三角餐桌；悬停或点选餐盘查看作品，A 和 D 转动餐桌"><p id="loading">正在加载…</p><div id="hotspots"></div></div>
<nav class="table-controls" aria-label="餐桌方向"><button id="previous" aria-label="向左旋转餐桌 120 度" title="向左旋转 120°">A</button><output id="side" aria-label="当前餐桌方向">01 / 03</output><button id="next" aria-label="向右旋转餐桌 120 度" title="向右旋转 120°">D</button></nav><div id="status" class="sr-only" aria-live="polite"></div></main>
<dialog id="inspector" aria-label="餐盘与三维物件查看窗口"><button id="close-inspector" aria-label="关闭查看窗口" title="关闭（Esc）">×</button><div id="detail-scene" role="region" aria-label="拖动物件旋转，滚轮缩放"></div><div class="detail-controls"><span class="gesture-hint">拖动旋转 · 滚轮缩放</span><div><button id="smaller" aria-label="缩小物件">−</button><output id="scale-label">100%</output><button id="larger" aria-label="放大物件">＋</button><button id="reset" aria-label="复位物件" title="复位">↺</button></div></div></dialog>
<script type="module" src="/src/main.js"></script></body></html>
